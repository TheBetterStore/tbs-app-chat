AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  tbs-app-chat

Parameters:
  Environment:
    Type: String
    Default: prod

  AppLoginCFName:
    Type: String

  InfraBaseCFName:
    Type: String

  KmsCFStackName:
    Type: String

  EcrImageUrl:
    Type: String

  QueryLoggingLevel:
    Type: String
    Default: DEBUG
    AllowedValues: [DEBUG, INFO, WARN, ERROR, FATAL]

  BedrockModel:
    Type: String
    Default: apac.anthropic.claude-sonnet-4-5-20250514-v1:0

  MaxTokens:
    Type: String
    Default: 1024

  AllowedCorsDomains:
    Type: String
    Description: Define allowed client UI domains here. Use commas to separate if multiple.
    Default: 'http://localhost:4200,https://thebetterstore.net'

  SystemPrompt:
    Type: String
    Default: 'You are a helpful shopping assistant for The Better Store, an electronics and books retailer. Keep responses brief. Use the lookup_inventory tool to check product availability when asked about products.'

  BraveApiKeyParam:
    Type: String
    Description: SSM Parameter Store param for Brave API key

  AllowedUser:
    Type: String
    Default: 'brycepc@hotmail.com'
    Description: Allowed username for WebSocket access

  AgentcoreChatMemoryExpiration:
    Type: Number
    Description: In days
    MaxValue: 365
    Default: 30

Resources:

  # --- AgentCore Runtime (Option B) ---

  AgentCoreRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      Path: "/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-AgentCoreRuntimePolicies
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BedrockPolicy
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
              - Sid: SsmPolicy
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/*"
              - Sid: KmsPolicy
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  Fn::ImportValue: !Sub ${KmsCFStackName}:InternalKmsKey:Arn
              - Sid: EcrPolicy
                Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: LogsPolicy
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
              - Sid: XRayPolicy
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                  - xray:GetSamplingStatisticSummaries
                Resource: "*"
              - Sid: MemoryPolicy
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:GetEvent
                  - bedrock-agentcore:ListEvents
                  - bedrock-agentcore:ListSessions
                  - bedrock-agentcore:RetrieveMemoryRecords
                Resource: "*"

  ChatAgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: "tbs_app_chat_Runtime"
      Description: "TBS Chat Agent - AgentCore Runtime v3"
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub
            - "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}/.well-known/openid-configuration"
            - UserPoolId:
                Fn::ImportValue: !Sub ${AppLoginCFName}:UserPoolId
          AllowedClients:
            - Fn::ImportValue: !Sub ${AppLoginCFName}:UserPoolWebClientId
      RequestHeaderConfiguration:
        RequestHeaderAllowlist:
          - "Authorization"
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref EcrImageUrl
      NetworkConfiguration:
        NetworkMode: PUBLIC
      RoleArn: !GetAtt AgentCoreRuntimeRole.Arn
      ProtocolConfiguration: HTTP
      EnvironmentVariables:
        BEDROCK_MODEL: !Ref BedrockModel
        MAX_TOKENS: !Ref MaxTokens
        SYSTEM_PROMPT: !Ref SystemPrompt
        PRODUCTS_API_BASE_URL: "https://api.thebetterstore.net/product/v1"
        BRAVE_API_KEY_PARAM: !Ref BraveApiKeyParam
        MEMORY_ID: !GetAtt ChatMemory.MemoryId
        OTEL_SEMCONV_STABILITY_OPT_IN: "gen_ai_tool_definitions"
        OTEL_TRACES_EXPORTER: "otlp"
        OTEL_SERVICE_NAME: "tbs_app_chat_Runtime.tbs_app_chat_Endpoint"
        AGENT_OBSERVABILITY_ENABLED: "true"
      LifecycleConfiguration:
        IdleRuntimeSessionTimeout: 900
        MaxLifetime: 14400
      # Note we need to enable tracing for use by evaluations manually via the web console; it is not yet supported in cfn

  ChatMemory:
    Type: AWS::BedrockAgentCore::Memory
    Properties:
      Name: "tbs_chat_memory"
      Description: "Short-term conversation memory for authenticated users"
      EventExpiryDuration: !Ref AgentcoreChatMemoryExpiration

  ChatAgentEndpoint:
    Type: AWS::BedrockAgentCore::RuntimeEndpoint
    Properties:
      AgentRuntimeId: !GetAtt ChatAgentRuntime.AgentRuntimeId
      Name: "tbs_app_chat_Endpoint"
      Description: "Production inference endpoint for TBS Chat"

  # --- Bedrock Evaluations ---

  EvaluationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TrustPolicyStatement
            Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:ResourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  - !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:evaluator/*"
                  - !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:online-evaluation-config/*"
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-EvalExecPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogReadStatement
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:GetQueryResults
                  - logs:StartQuery
                Resource: "*"
              - Sid: CloudWatchLogWriteStatement
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/evaluations/*"
              - Sid: CloudWatchIndexPolicyStatement
                Effect: Allow
                Action:
                  - logs:DescribeIndexPolicies
                  - logs:PutIndexPolicy
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans:*"
              - Sid: BedrockInvokeStatement
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"

  ChatAgentOnlineEvaluation:
    Type: AWS::BedrockAgentCore::OnlineEvaluationConfig
    DependsOn:
      - ChatAgentEndpoint
    Properties:
      OnlineEvaluationConfigName: tbs_chat_online_eval
      Description: "Online evaluation for TBS Chat Agent"
      ExecutionStatus: ENABLED
      EvaluationExecutionRoleArn: !GetAtt EvaluationExecutionRole.Arn
      DataSourceConfig:
        CloudWatchLogs:
          LogGroupNames:
            - "aws/spans"
            - !Sub "/aws/bedrock-agentcore/runtimes/${ChatAgentRuntime.AgentRuntimeId}-tbs_app_chat_Endpoint"
          ServiceNames:
            - "tbs_app_chat_Runtime.tbs_app_chat_Endpoint"
      Evaluators:
        - EvaluatorId: "Builtin.Helpfulness"
        - EvaluatorId: "Builtin.Coherence"
        - EvaluatorId: "Builtin.ResponseRelevance"
        - EvaluatorId: "Builtin.Harmfulness"
      Rule:
        SamplingConfig:
          SamplingPercentage: 100


Outputs:

  AgentCoreRuntimeArn:
    Description: AgentCore Runtime ARN
    Value: !GetAtt ChatAgentRuntime.AgentRuntimeArn

  AgentCoreEndpointArn:
    Description: AgentCore Runtime Endpoint ARN
    Value: !GetAtt ChatAgentEndpoint.AgentRuntimeEndpointArn

